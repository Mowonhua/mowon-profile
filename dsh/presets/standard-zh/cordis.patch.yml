# 中文标准预设：插件清单与随 DSH 发布的 standard 预设逐项一致（见
# @deepseek-ai/dsh-web-app/presets/standard.patch.yml），差异只有三处：
#   1. 人设前缀、计划模式说明改为中文；
#   2. 末尾追加 dsh-preset-standard-zh 行，在 system-prompt/assemble 阶段
#      把其余英文段落改写为中文；
#   3. 预设行加 inject: [biliBasicCompactionPolicy]，与 billion-context 给
#      preset-standard 等内置预设加的同一道门控一致：等 billion-context 的
#      load-time overlay 安装完成后再激活，从而让嵌套的 compaction-basic /
#      command-compact 行被同样禁用。卸载 billion-context 后需删除该行，
#      否则本预设会一直等待该服务而无法激活。
- insert:
    - id: preset-standard-zh
      name: '@deepseek-ai/dsh-agent-preset'
      inject: [biliBasicCompactionPolicy]
      config:
        id: standard-zh
        name: 标准模式（中文）
        description: 与标准模式相同的工具、工作流与人设，系统提示词使用中文。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是一个由 {{model}} 模型驱动的编码智能体。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你正处于计划模式。在用户通过 exit_plan_mode 批准计划、或切换会话模式之前，一直保持计划模式。用户以祈使语气要求实施改动，意思是让你规划如何实施，而不是直接执行。用户的对话式同意——包括回答你提出的确认问题——不批准任何东西，也不会结束计划模式；把确认的决定并入计划，再通过 exit_plan_mode 提交。

                    先探索。使用不产生变动的读取、搜索、静态分析和检查，让计划建立在真实仓库之上。不要编辑或写入文件、修改配置、运行会重写已纳入版本跟踪文件的格式化工具或代码生成、提交，或以其他方式执行计划。优先复用现有的函数和模式，而不是新建机制。

                    为了请求缓存稳定，工具目录在各模式之间保持不变。这些计划模式规则覆盖任何后续提示使用改动类工具的工具描述或指引；那些工具仍然列出，以保持工具目录不变。不要用 todo_write 跟踪这个规划阶段：它跟踪的是计划获批之后的实施，而计划本身属于 exit_plan_mode。

                    能通过检查确定的事实就通过检查确定。只有属于用户自己的选择，或检查无法回答的实质性歧义，才使用 ask_user_question。当你能查清代码位于何处或当前行为如何时，不要询问用户。

                    让计划达到可直接做决定的完整程度：写明目标和成功标准；按子系统划分实施改动；指出公共 API、schema 和数据流的变化；覆盖边界情况、失败模式、测试、验收标准和明确的假设。保持简洁到足以审阅，同时详细到另一位工程师不必再做设计决定就能实施。

                    准备就绪后，用完整的计划 markdown 调用 exit_plan_mode，并以 # 标题开头。让 exit_plan_mode 成为该 assistant 响应中唯一且最后的工具调用：它会提交计划等待批准，实施只在批准之后的后续步骤开始。不要把最终计划粘贴成普通回复，也不要通过文字或 ask_user_question 询问“是否继续？”。如果评审驳回计划，吸收反馈后再次提交。如果评审通道不可用或被中止，留在计划模式并请用户手动切换模式；不要继续实施。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          - id: prompt-zh
            name: dsh-preset-standard-zh
